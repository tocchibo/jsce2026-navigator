<!doctype html>
<html lang="ja" data-event-config="../events/jsme2026/event.json">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta id="theme-color" name="theme-color" content="#43316f" />
    <meta
      id="page-description"
      name="description"
      content="日本機械学会 2026年度年次大会を回るためのスマートフォン向けタイムテーブル"
    />
    <title>JSME 2026 Navigator</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23f2cf58'/%3E%3Ctext x='32' y='43' text-anchor='middle' font-size='34'%3E機%3C/text%3E%3C/svg%3E" />
    <link rel="stylesheet" href="../assets/navigator.css" />
    <script src="../assets/navigator.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="#top" aria-label="トップへ戻る">
          <span id="brand-mark" class="brand-mark" aria-hidden="true">機</span>
          <span>
            <strong id="brand-name">JSME 2026</strong>
            <small id="brand-subtitle">大会ナビ</small>
          </span>
        </a>
        <a
          id="official-link"
          class="bookmark-link"
          href="https://pub.confit.atlas.jp/ja/event/jsme2026/bookmarks"
          target="_blank"
          rel="noopener noreferrer"
        >
          <span id="official-link-label">本家ブックマーク</span>
          <span aria-hidden="true">↗</span>
        </a>
      </div>
    </header>

    <main id="top">
      <nav id="program-tabs" class="program-tabs" aria-label="表示するプログラムを選択">
        <button class="program-tab program-tab-plan" type="button" data-program-tab="plan" hidden>
          <span>MY PLAN</span>
          <strong>本命</strong>
        </button>
        <button class="program-tab program-tab-now is-active" type="button" data-program-tab="now">
          <span>NOW</span>
          <strong>今から1時間</strong>
        </button>
      </nav>

      <details class="filter-panel shared-filter">
        <summary id="filter-summary">
          <span>絞り込み</span>
          <span id="filter-summary-note" class="filter-summary-note">分野・企画種別・棟・キーワード</span>
        </summary>
        <div class="filter-controls">
          <label class="query-field">
            <span>キーワード</span>
            <input id="query-filter" type="search" placeholder="題名・氏名・所属・講演番号" />
          </label>
          <p class="multi-filter-note">各欄では、選んだ項目のいずれかに一致するセッションを表示します。</p>
          <div class="multi-filter-grid">
            <details class="multi-select">
              <summary>
                <span id="theme-filter-name">分野</span>
                <b id="theme-filter-label">すべて</b>
              </summary>
              <div id="theme-filter" class="multi-select-options"></div>
            </details>
            <details class="multi-select">
              <summary>
                <span id="division-filter-name">企画種別</span>
                <b id="division-filter-label">すべて</b>
              </summary>
              <div id="division-filter" class="multi-select-options"></div>
            </details>
            <details class="multi-select">
              <summary>
                <span id="campus-filter-name">棟</span>
                <b id="campus-filter-label">すべて</b>
              </summary>
              <div id="campus-filter" class="multi-select-options"></div>
            </details>
          </div>
          <button id="clear-filters" class="clear-filter-button" type="button" disabled>条件をクリア</button>
        </div>
      </details>

      <section id="plan-view" class="section-block plan-block view-panel" aria-labelledby="plan-heading" hidden>
        <div class="plan-hero">
          <div>
            <span class="section-kicker">PERSONAL ITINERARY</span>
            <h1 id="plan-heading">本命スケジュール</h1>
          </div>
          <span id="plan-count" class="count-badge">0件</span>
          <p id="plan-description"></p>
        </div>
        <div id="plan-sessions" class="plan-days" aria-live="polite"></div>
      </section>

      <section id="now-view" class="section-block now-block view-panel" aria-labelledby="now-heading">
        <div class="reference-panel">
          <label for="reference-datetime">
            <span>表示基準日時（日本時間）</span>
            <input id="reference-datetime" type="datetime-local" step="60" />
          </label>
          <button id="use-real-time" class="reference-now-button" type="button">現在時刻</button>
        </div>
        <div class="section-heading">
          <div>
            <span class="section-kicker">NOW + 60 MIN</span>
            <h2 id="now-heading">今から1時間</h2>
          </div>
          <span id="session-count" class="count-badge">0件</span>
        </div>
        <div id="upcoming-sessions" class="session-list" aria-live="polite"></div>
      </section>

      <section id="schedule-view" class="section-block schedule-block view-panel" aria-labelledby="schedule-heading" hidden>
        <div class="section-heading">
          <div>
            <span class="section-kicker">ALL DAY</span>
            <h2 id="schedule-heading">この日のセッション</h2>
          </div>
        </div>
        <div id="schedule-sessions" class="schedule-groups"></div>
      </section>

      <aside class="mock-note">
        <strong id="program-note-heading">収録範囲について</strong>
        <p id="program-note-body">
          追加されたプログラムPDFに収録された「技術・社会・教育」分野の9月6日〜9日の企画を掲載しています。
        </p>
      </aside>
    </main>

    <dialog id="session-dialog" class="session-dialog" aria-labelledby="session-dialog-title">
      <div class="session-dialog-shell">
        <header class="session-dialog-header">
          <div>
            <span>SESSION DETAIL</span>
            <strong>セッション詳細</strong>
          </div>
          <button id="session-dialog-close" type="button" aria-label="セッション詳細を閉じる">×</button>
        </header>
        <div id="session-dialog-content" class="session-dialog-content"></div>
      </div>
    </dialog>
  </body>
</html>
