<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#123c4a" />
    <meta
      name="description"
      content="令和8年度 土木学会全国大会を回るためのスマートフォン向けタイムテーブル"
    />
    <title>JSCE 2026 Navigator</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23f3c74f'/%3E%3Ctext x='32' y='43' text-anchor='middle' font-size='34'%3E土%3C/text%3E%3C/svg%3E" />
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="#top" aria-label="トップへ戻る">
          <span class="brand-mark" aria-hidden="true">土</span>
          <span>
            <strong>JSCE 2026</strong>
            <small>大会ナビ</small>
          </span>
        </a>
        <a
          class="bookmark-link"
          href="https://pub.confit.atlas.jp/ja/event/jsce2026/bookmarks"
          target="_blank"
          rel="noopener noreferrer"
        >
          本家ブックマーク
          <span aria-hidden="true">↗</span>
        </a>
      </div>
    </header>

    <main id="top">
      <nav class="program-tabs" aria-label="表示するプログラムを選択">
        <button class="program-tab program-tab-now is-active" type="button" data-program-tab="now">
          <span>NOW</span>
          <strong>今から1時間</strong>
        </button>
        <button class="program-tab" type="button" data-program-tab="2026-09-02">
          <span>DAY 1</span>
          <strong>9/2</strong>
          <small>水</small>
        </button>
        <button class="program-tab" type="button" data-program-tab="2026-09-03">
          <span>DAY 2</span>
          <strong>9/3</strong>
          <small>木</small>
        </button>
        <button class="program-tab" type="button" data-program-tab="2026-09-04">
          <span>DAY 3</span>
          <strong>9/4</strong>
          <small>金</small>
        </button>
      </nav>

      <details class="filter-panel shared-filter">
        <summary id="filter-summary">
          <span>絞り込み</span>
          <span class="filter-summary-note">テーマ・部門・会場・キーワード</span>
        </summary>
        <div class="filter-controls">
          <label class="query-field">
            <span>キーワード</span>
            <input id="query-filter" type="search" placeholder="題名・氏名・所属・講演番号" />
          </label>
          <label>
            <span>テーマから探す</span>
            <select id="theme-filter"><option value="">すべてのテーマ</option></select>
          </label>
          <div class="select-row">
            <label>
              <span>部門</span>
              <select id="division-filter"><option value="">すべての部門</option></select>
            </label>
            <label>
              <span>キャンパス</span>
              <select id="campus-filter"><option value="">すべてのキャンパス</option></select>
            </label>
          </div>
          <button id="clear-filters" class="clear-filter-button" type="button" disabled>条件をクリア</button>
        </div>
      </details>

      <section id="now-view" class="section-block now-block view-panel" aria-labelledby="now-heading">
        <div class="reference-panel">
          <label for="reference-datetime">
            <span>表示基準日時（日本時間）</span>
            <input id="reference-datetime" type="datetime-local" step="60" />
          </label>
          <button id="use-real-time" class="reference-now-button" type="button">現在時刻</button>
        </div>
        <div class="section-heading">
          <div>
            <span class="section-kicker">NOW + 60 MIN</span>
            <h2 id="now-heading">今から1時間</h2>
          </div>
          <span id="session-count" class="count-badge">0件</span>
        </div>
        <div id="upcoming-sessions" class="session-list" aria-live="polite"></div>
      </section>

      <section id="schedule-view" class="section-block schedule-block view-panel" aria-labelledby="schedule-heading" hidden>
        <div class="section-heading">
          <div>
            <span class="section-kicker">ALL DAY</span>
            <h2 id="schedule-heading">この日のセッション</h2>
          </div>
        </div>
        <div id="schedule-sessions" class="schedule-groups"></div>
      </section>

      <aside class="mock-note">
        <strong>プログラムについて</strong>
        <p>
          9月2日〜4日のプログラムPDFをもとに掲載しています。講演を選ぶとConfitの公式ページを開きます。
        </p>
      </aside>
    </main>

  </body>
</html>
