<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#123c4a" />
    <meta
      name="description"
      content="令和8年度 土木学会全国大会を回るためのスマートフォン向けタイムテーブル"
    />
    <title>JSCE 2026 Navigator</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23f3c74f'/%3E%3Ctext x='32' y='43' text-anchor='middle' font-size='34'%3E土%3C/text%3E%3C/svg%3E" />
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="#top" aria-label="トップへ戻る">
          <span class="brand-mark" aria-hidden="true">土</span>
          <span>
            <strong>JSCE 2026</strong>
            <small>大会ナビ</small>
          </span>
        </a>
        <a
          class="bookmark-link"
          href="https://pub.confit.atlas.jp/ja/event/jsce2026/bookmarks"
          target="_blank"
          rel="noopener noreferrer"
        >
          本家ブックマーク
          <span aria-hidden="true">↗</span>
        </a>
      </div>
    </header>

    <main id="top">
      <section class="hero" aria-label="表示日時">
        <div class="time-panel">
          <div>
            <span class="time-label">表示基準</span>
            <div class="current-time">
              <span id="current-date">9月2日（水）</span>
              <strong id="current-time">10:15</strong>
            </div>
          </div>
          <div class="time-actions">
            <label class="time-input-label" for="time-input">
              時刻を試す
              <input id="time-input" type="time" value="10:15" step="300" />
            </label>
            <button id="use-real-time" class="quiet-button" type="button">現在時刻</button>
          </div>
        </div>

        <div id="demo-notice" class="demo-notice">
          <span>DEMO</span>
          大会期間外のため、確認用日時を表示しています
        </div>
      </section>

      <nav class="date-tabs" aria-label="開催日を選択">
        <button class="date-tab is-active" type="button" data-date="2026-09-02">
          <span>DAY 1</span>
          <strong>9/2</strong>
          <small>水</small>
        </button>
        <button class="date-tab" type="button" data-date="2026-09-03">
          <span>DAY 2</span>
          <strong>9/3</strong>
          <small>木</small>
        </button>
        <button class="date-tab" type="button" data-date="2026-09-04">
          <span>DAY 3</span>
          <strong>9/4</strong>
          <small>金</small>
        </button>
      </nav>

      <section class="section-block now-block" aria-labelledby="now-heading">
        <div class="section-heading">
          <div>
            <span class="section-kicker">NOW + 60 MIN</span>
            <h2 id="now-heading">今から1時間</h2>
          </div>
          <span id="session-count" class="count-badge">0件</span>
        </div>
        <details class="filter-panel">
          <summary id="filter-summary">
            <span>絞り込み</span>
            <span class="filter-summary-note">部門・会場・キーワード</span>
          </summary>
          <div class="filter-controls">
            <label class="query-field">
              <span>キーワード</span>
              <input id="query-filter" type="search" placeholder="題名・氏名・所属・講演番号" />
            </label>
            <div class="select-row">
              <label>
                <span>部門</span>
                <select id="division-filter"><option value="">すべての部門</option></select>
              </label>
              <label>
                <span>キャンパス</span>
                <select id="campus-filter"><option value="">すべてのキャンパス</option></select>
              </label>
            </div>
            <button id="clear-filters" class="clear-filter-button" type="button" disabled>条件をクリア</button>
          </div>
        </details>
        <div id="upcoming-sessions" class="session-list" aria-live="polite"></div>
      </section>

      <section id="day-schedule" class="section-block schedule-block" aria-labelledby="schedule-heading">
        <div class="section-heading">
          <div>
            <span class="section-kicker">ALL DAY</span>
            <h2 id="schedule-heading">この日のセッション</h2>
          </div>
        </div>
        <div id="schedule-sessions" class="schedule-list"></div>
      </section>

      <aside class="mock-note">
        <strong>プログラムについて</strong>
        <p>
          9月2日〜4日のプログラムPDFをもとに掲載しています。講演を選ぶとConfitの公式ページを開きます。
        </p>
      </aside>
    </main>

    <nav class="bottom-nav" aria-label="主要メニュー">
      <a class="is-current" href="#top">
        <span aria-hidden="true">◷</span>
        今から1時間
      </a>
      <a href="#day-schedule">
        <span aria-hidden="true">▦</span>
        日別一覧
      </a>
      <a
        href="https://pub.confit.atlas.jp/ja/event/jsce2026/bookmarks"
        target="_blank"
        rel="noopener noreferrer"
      >
        <span aria-hidden="true">☆</span>
        本家保存
      </a>
    </nav>
  </body>
</html>
